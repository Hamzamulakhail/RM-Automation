name: Build RM Automation Desktop (.exe)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        run: npm install

      - name: Build Windows installer (.exe)
        run: npm run build

      - name: Upload Windows .exe installers
        uses: actions/upload-artifact@v4
        with:
          name: RM-Automation-Windows-Installer
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
