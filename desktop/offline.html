<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RM Automation — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 24px;
    }
    .box {
      max-width: 420px;
      width: 100%;
      background: #111827;
      border: 1px solid #222e46;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    img {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      margin-bottom: 14px;
      object-fit: cover;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
    }
    p {
      margin: 0 0 20px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.55;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="box">
    <img src="assets/icon.png" alt="RM Automation" />
    <h1>Cannot Reach RM Automation</h1>
    <p>Please check your internet connection and click Retry below to connect to the workspace.</p>
    <button type="button" onclick="window.location.href='https://mulakhail.rmautomation.workers.dev'">
      Retry Connection
    </button>
  </div>
</body>
</html>
